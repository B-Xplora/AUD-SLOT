<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Revolut</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --revolut-blue: #0666EB;
    --revolut-dark: #0B0E11;
    --revolut-gray: #8B95A8;
    --white: #FFFFFF;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #0B0E11;
    color: var(--white);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .phone {
    width: 100%;
    max-width: 390px;
    background: #12151A;
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    position: relative;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px 8px;
    font-size: 14px;
    font-weight: 600;
  }

  .header {
    padding: 12px 24px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .avatar {
    width: 36px;
    height: 36px;
    background: #1E2329;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 600;
    color: #8B95A8;
  }

  .content {
    padding: 10px 24px 40px;
  }

  .balance-label {
    font-size: 14px;
    color: var(--revolut-gray);
    margin-bottom: 8px;
  }

  .balance-amount {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1.5px;
    margin-bottom: 40px;
  }

  .currency {
    font-size: 22px;
    font-weight: 500;
    color: var(--revolut-gray);
    margin-left: 4px;
  }

  .btn-open {
    width: 100%;
    background: var(--revolut-blue);
    color: white;
    border: none;
    padding: 18px;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }

  .btn-open:hover {
    background: #0558C9;
  }

  .btn-open:active {
    transform: scale(0.98);
  }

  /* ========== ACTION REQUIRED POPUP ========== */
  .popup-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
    z-index: 100;
  }

  .popup-overlay.show {
    opacity: 1;
    visibility: visible;
  }

  .popup {
    background: #1A1D23;
    border-radius: 24px;
    padding: 28px 24px;
    width: 100%;
    max-width: 320px;
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 1px solid #2A2F38;
  }

  .popup-overlay.show .popup {
    transform: scale(1);
  }

  .robot {
    font-size: 48px;
    margin-bottom: 12px;
  }

  .popup-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
    color: #FF6B6B;
  }

  .popup-subtitle {
    font-size: 14px;
    color: var(--revolut-gray);
    margin-bottom: 20px;
  }

  .fee-box {
    background: #12151A;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 24px;
  }

  .fee-label {
    font-size: 13px;
    color: var(--revolut-gray);
    margin-bottom: 4px;
  }

  .fee-amount {
    font-size: 28px;
    font-weight: 700;
    color: #FF6B6B;
  }

  .popup-text {
    font-size: 14px;
    color: #C8CDD6;
    line-height: 1.5;
    margin-bottom: 24px;
  }

  .btn-popup {
    width: 100%;
    background: var(--revolut-blue);
    color: white;
    border: none;
    padding: 15px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-popup:active {
    transform: scale(0.98);
  }

  .btn-close {
    margin-top: 12px;
    background: transparent;
    color: var(--revolut-gray);
    border: none;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<div class="phone">
  <!-- Status bar -->
  <div class="status-bar">
    <span>---</span>
    <span>●●●●●</span>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="logo">Revolut</div>
    <div class="avatar">VM</div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="balance-label">Total balance</div>
    <div class="balance-amount">
      $189,000<span class="currency">USD</span>
    </div>

    <button class="btn-open" onclick="showActionRequired()">
      OPEN FUNDS
    </button>
  </div>

  <!-- ACTION REQUIRED POPUP -->
  <div class="popup-overlay" id="actionPopup">
    <div class="popup">
      <div class="robot">🤖</div>
      <div class="popup-title">Action Required</div>
      <div class="popup-subtitle">Revolut Security Robot</div>

      <div class="fee-box">
        <div class="fee-label">2FA SECURITY ADDED DUE TO PREVIOUS HACK</div>
        <div class="fee-amount">$91</div>
      </div>

      <div class="popup-text">
        A one-time 2FA verification pass is required to continue processing the transfer to <strong>Victor Magnes</strong>.
      </div>

      <button class="btn-popup" onclick="alert('2FA payment of $91 required')">
        Pay $91 to Continue
      </button>
      <button class="btn-close" onclick="closePopup()">Cancel</button>
    </div>
  </div>
</div>

<script>
  function showActionRequired() {
    document.getElementById('actionPopup').classList.add('show');
  }

  function closePopup() {
    document.getElementById('actionPopup').classList.remove('show');
  }

  // Close when clicking outside the popup
  document.getElementById('actionPopup').addEventListener('click', function(e) {
    if (e.target === this) {
      closePopup();
    }
  });
</script>
</body>
</html>
